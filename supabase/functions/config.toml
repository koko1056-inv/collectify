
project_id = "dmgrgzysrzzgsajwqyrh"

# RevenueCat calls this endpoint without a Supabase JWT — it uses
# the RC_WEBHOOK_SECRET Bearer token for auth instead.
[[functions]]
name = "revenuecat-webhook"
verify_jwt = false

[[functions]]
name = "scrape-images"
verify_jwt = true

[[functions]]
name = "analyze-image"
verify_jwt = true

[[functions]]
name = "generate-avatar"
verify_jwt = true

# 新しいタグができたことを運営にメールで知らせる。
# ログイン済みの利用者からしか呼ばれないので JWT を検証する。
[[functions]]
name = "notify-new-tag"
verify_jwt = true
