<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0a1f" media="(prefers-color-scheme: dark)" />
    <!-- ホーム画面に追加したとき、ブラウザの枠なしで開く（iOS はこの指定が必要） -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Collectify" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Collectify - 推しグッズの図鑑</title>
    <meta name="description" content="推しグッズの図鑑アプリ。アニメ・ゲーム・アイドルのグッズを登録して眺め、シリーズのコンプを目指し、ダブったグッズは交換に出せます。" />
    <meta name="author" content="Collectify" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Collectify - 推しグッズの図鑑" />
    <meta property="og:description" content="推しグッズの図鑑アプリ。アニメ・ゲーム・アイドルのグッズを登録して眺め、シリーズのコンプを目指し、ダブったグッズは交換に出せます。" />
    <meta property="og:image" content="https://collectify.jp/og-image.png" />
    <meta property="og:url" content="https://collectify.jp/" />
    <meta property="og:site_name" content="Collectify" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Collectify - 推しグッズの図鑑" />
    <meta name="twitter:description" content="推しグッズの図鑑アプリ。アニメ・ゲーム・アイドルのグッズを登録して眺め、シリーズのコンプを目指し、ダブったグッズは交換に出せます。" />
    <meta name="twitter:image" content="https://collectify.jp/og-image.png" />
    <!-- SPA のため個別ページ(アイテム等)には別途 canonical を出していない（ボット向けは api/og.ts が担う）。
         ここはトップページ自体のカノニカル -->
    <link rel="canonical" href="https://collectify.jp/" />

    <!-- 画像（サムネ・Storage）と API の接続を先に張っておく。
         <img> は crossorigin なし、supabase-js の fetch は CORS なので接続が別になる。両方張る -->
    <link rel="preconnect" href="https://dmgrgzysrzzgsajwqyrh.supabase.co" />
    <link rel="preconnect" href="https://dmgrgzysrzzgsajwqyrh.supabase.co" crossorigin />

    <!-- フォントはレンダーブロックを避けて並列ダウンロード（display=swap） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Righteous&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Righteous&display=swap"
      />
    </noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
