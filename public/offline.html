<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF6EE" />
    <title>オフライン | Collectify</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        background: radial-gradient(circle at 50% 35%, #FCE3E7 0, #FFF6EE 60%);
        color: #17171C; font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; text-align: center;
      }
      main { max-width: 340px; }
      img { height: 150px; width: auto; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { margin: 0; color: #5E5E68; font-size: 14px; line-height: 1.7; }
      button {
        margin-top: 24px; padding: 12px 28px; border: 0; border-radius: 999px; font-size: 15px; font-weight: 700;
        background: #C92A45; color: #fff; cursor: pointer; box-shadow: 0 4px 0 #A61F37;
      }
      button:focus-visible { outline: 3px solid #17171C; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pocke/sad.webp" alt="" height="150" />
      <h1>オフラインみたい…</h1>
      <p>ネットワークにつながっていないよ。電波のよいところで、もう一度ひらいてね。</p>
      <button type="button" onclick="location.reload()">再読み込み</button>
    </main>
  </body>
</html>
