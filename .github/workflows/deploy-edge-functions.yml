# Edge Function を main への push で自動デプロイする
#
# 手で配置すると、関数のコードを一字一句書き写すことになる。
# 実際にこの作業で日本語の転記ミスを3回出した（「ページ」→「フェージ」、
# 「アスペクト」→「アスパクト」、「構築」→「構箉」）。構文は壊れないので
# デプロイは通ってしまい、AIに渡すプロンプトが静かに劣化する。
#
# CLI はリポジトリのファイルをそのまま送るので、この種のミスが原理的に起きない。
#
# 必要なもの: リポジトリの Secrets に SUPABASE_ACCESS_TOKEN
#   https://supabase.com/dashboard/account/tokens で発行し、
#   GitHub の Settings → Secrets and variables → Actions に登録する。
#
# verify_jwt は supabase/config.toml の指定が使われる。
# あのファイルに無い関数は既定の true になり、JWT を持たない相手から
# 呼ばれる関数（og-image / proxy-image / revenuecat-webhook など）が壊れる。
# 関数を足したときは config.toml にも必ず書くこと。

name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-edge-functions.yml"
  # 手動でも流せるようにしておく（切り戻しや再実行のため）
  workflow_dispatch:

concurrency:
  # 連続で push されたときに古い方を走らせない
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # config.toml に載っていない関数があれば止める。
      # 載せ忘れると verify_jwt が既定の true になって壊れるため、
      # デプロイしてから気づくのでは遅い。
      - name: config.toml の記載漏れを検出
        run: |
          missing=0
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            case "$name" in _*) continue ;; esac
            if ! grep -q "^\[functions\.${name}\]" supabase/config.toml; then
              echo "::error::supabase/config.toml に [functions.${name}] がありません"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "verify_jwt が既定の true になるため中止しました。" >&2
            exit 1
          fi
          echo "すべての関数が config.toml に記載されています"

      - name: デプロイ
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN が未設定です。リポジトリの Secrets に登録してください。"
            exit 1
          fi
          # project-ref は config.toml の project_id から取る
          ref="$(sed -n 's/^project_id *= *"\(.*\)"/\1/p' supabase/config.toml)"
          echo "project: $ref"
          supabase functions deploy --project-ref "$ref"
